{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Create New Trek</h2>

<div class="row">
    <div class="col-md-6">
        <form method="POST" action="{{ url_for('admin.create_trek') }}">
            <div class="mb-3">
                <label>Trek Name</label>
                <input type="text" name="name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Location</label>
                <input type="text" name="location" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Difficulty</label>
                <select name="difficulty" class="form-select">
                    <option value="Easy">Easy</option>
                    <option value="Moderate">Moderate</option>
                    <option value="Hard">Hard</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Duration (days)</label>
                <input type="number" name="duration" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Total Slots</label>
                <input type="number" name="total_slots" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Start Date</label>
                <input type="date" name="start_date" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>End Date</label>
                <input type="date" name="end_date" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Description</label>
                <textarea name="description" class="form-control" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-dark w-100">Create Trek</button>
        </form>
    </div>
</div>
{% endblock %}
