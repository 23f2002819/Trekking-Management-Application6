{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">Admin Dashboard</h2>

<div class="row">
    <div class="col-md-3">
        <div class="card text-white bg-dark mb-3">
            <div class="card-body text-center">
                <h3>{{ total_treks }}</h3>
                <p>Total Treks</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-success mb-3">
            <div class="card-body text-center">
                <h3>{{ total_users }}</h3>
                <p>Total Users</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-primary mb-3">
            <div class="card-body text-center">
                <h3>{{ total_staff }}</h3>
                <p>Total Staff</p>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card text-white bg-warning mb-3">
            <div class="card-body text-center">
                <h3>{{ total_bookings }}</h3>
                <p>Total Bookings</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
