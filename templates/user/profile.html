{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">My Profile</h2>

<div class="row">
    <div class="col-md-4">
        <form method="POST" action="{{ url_for('user.profile') }}">
            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="name" class="form-control" value="{{ current_user.name }}" required>
            </div>
            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" value="{{ current_user.email }}" disabled>
            </div>
            <div class="mb-3">
                <label>Phone</label>
                <input type="text" name="phone" class="form-control" value="{{ current_user.phone or '' }}">
            </div>
            <button type="submit" class="btn btn-dark w-100">Update Profile</button>
        </form>
    </div>
</div>
{% endblock %}
